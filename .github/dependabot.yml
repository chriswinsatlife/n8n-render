# .github/dependabot.yml

# This file tells Dependabot what to check for updates.
version: 2
updates:
  # Scans the n8n Dockerfile for base image updates.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly" # Throttled from daily to cut Actions minutes.
    open-pull-requests-limit: 3
    ignore:
      # Only surface major version bumps; skip minor and patch churn.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
